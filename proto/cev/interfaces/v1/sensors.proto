syntax = "proto3";

package cev.interfaces.v1;

import "cev/interfaces/v1/common.proto";

message Imu {
  uint64 stamp_ns = 1;
  // m/s^2
  Vector3 linear_acceleration = 2;
  // rad/s about x (roll), y (pitch), z (yaw)
  Vector3 angular_velocity = 3;
}

message WheelSpeed {
  uint64 stamp_ns = 1;
  // positive => forward motion
  double rev_per_s = 2;
}

syntax = "proto3";

package cev.interfaces.v1;

// units are in SI, angles are radians
// axes follow ROS REP-103 convention, i.e.
// x forward, y left, z up
// world frames are x east, y north, z up

// header for topics if useful
// tbh im not convinced we will always need all of this so this is TBD
// don't use this if you don't want to
message Header {
  uint64 stamp_ns = 1;
  // Transform frame of the data
  string frame_id = 2;
  // per-topic sequential id
  uint64 seq = 3;
}

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Quaternion {
  double x = 1;
  double y = 2;
  double z = 3;
  double w = 4;
}

message Point2 {
  double x = 1;
  double y = 2;
}

message Pose2 {
  Point2 position = 1;
  // Counterclockwise from +x, in (-pi, pi].
  double heading = 2;
}

// WGS84 standard
message GeoPoint {
  double latitude_deg = 1;
  double longitude_deg = 2;
  // height above the ellipsoid
  optional double altitude_m = 3;
}
